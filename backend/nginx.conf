upstream foodsy_backend {
    server localhost:8080;
    keepalive 32;
}

server {
    server_name apifoodsy-backend.com www.apifoodsy-backend.com;

    # WebSocket / SockJS endpoint — requires HTTP upgrade headers and long timeouts.
    # proxy_buffering off is required so SockJS XHR-streaming responses are not held
    # in nginx's buffer (which would break the long-lived streaming connection).
    location /ws {
        proxy_pass http://foodsy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # All other requests — let Spring Boot handle CORS entirely.
    # Removing nginx CORS headers here prevents duplicate Access-Control-Allow-Origin
    # headers (one from nginx, one from Spring) which browsers reject.
    location / {
        proxy_pass http://foodsy_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/apifoodsy-backend.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apifoodsy-backend.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = apifoodsy-backend.com) {
        return 301 https://$host$request_uri;
    }
    server_name apifoodsy-backend.com www.apifoodsy-backend.com;
    listen 80;
    return 404;
}
