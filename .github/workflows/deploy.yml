name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build & Test
        run: ./gradlew build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Pull latest code
            cd /home/ubuntu/foodsy
            git fetch origin main
            git reset --hard origin/main

            # Rebuild and restart the backend container
            cd backend
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            # Wait for backend health (max 2.5 minutes)
            echo "Waiting for backend to become healthy..."
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "Backend is healthy after $i attempts"
                HEALTHY=true
                break
              fi
              echo "Attempt $i/30 - not ready yet, waiting 5s..."
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "ERROR: Backend failed to become healthy after 150 seconds"
              docker compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi

            # Update nginx config and reload
            sudo cp /home/ubuntu/foodsy/backend/nginx.conf /etc/nginx/sites-available/foodsy
            # Ensure sites-enabled symlink exists
            sudo ln -sf /etc/nginx/sites-available/foodsy /etc/nginx/sites-enabled/foodsy
            sudo nginx -t
            sudo systemctl reload nginx
            echo "Deployment complete"
