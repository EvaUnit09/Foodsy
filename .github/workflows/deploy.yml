name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build JAR
        run: ./gradlew build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*-SNAPSHOT.jar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar

      - name: Stage JAR for upload
        run: mv backend-jar/*.jar app.jar

      - name: Copy JAR to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no app.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/foodsy/backend/app.jar
          rm /tmp/deploy_key

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e

            # Pull latest config/scripts
            cd ~/foodsy
            git fetch origin main
            git reset --hard origin/main

            # Rebuild image (just copies the pre-built JAR - very fast) and restart
            cd backend
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            # Wait for backend health (max 2.5 minutes)
            echo "Waiting for backend to become healthy..."
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "Backend is healthy after $i attempts"
                HEALTHY=true
                break
              fi
              echo "Attempt $i/30 - not ready yet, waiting 5s..."
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "ERROR: Backend failed to become healthy after 150 seconds"
              docker compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi

            # Update nginx config and reload
            sudo cp ~/foodsy/backend/nginx.conf /etc/nginx/sites-available/foodsy
            sudo ln -sf /etc/nginx/sites-available/foodsy /etc/nginx/sites-enabled/foodsy
            sudo nginx -t
            sudo systemctl reload nginx
            echo "Deployment complete"
